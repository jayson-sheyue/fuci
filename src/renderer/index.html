<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:; media-src 'self' data: blob:;" />
  <title>浮词</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="shell">
    <button id="orb" class="orb" type="button" aria-label="双击展开搜索框" title="双击展开">
      <canvas id="orb-flow" width="144" height="144" aria-hidden="true"></canvas>
      <span id="orb-update-dot" class="update-dot" hidden>有可用更新</span>
    </button>
    <form id="search" class="capsule">
      <button id="seal" class="seal" type="button" aria-label="按住拖动，双击收成悬浮球" title="按住拖动，双击收成悬浮球">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
          <circle cx="10.5" cy="10.5" r="6.25"></circle>
          <path d="M15.2 15.2L19.5 19.5"></path>
        </svg>
      </button>
      <input id="q" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="英语、日语或中文" aria-label="查询" />
      <kbd id="hint"></kbd>
      <button id="clear" type="button" hidden aria-label="清除">×</button>
      <span id="busy" hidden class="busy" aria-hidden="true"></span>
      <button id="lang" class="lang-pin is-pinned" type="button" aria-label="翻译方向：英→中" title="把英语译成中文。点一下切换方向。">英→中</button>
      <button id="gear" type="button" aria-label="设置" title="设置">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M12 3.5v2.2M12 18.3v2.2M3.5 12h2.2M18.3 12h2.2M5.8 5.8l1.6 1.6M16.6 16.6l1.6 1.6M18.2 5.8l-1.6 1.6M7.4 16.6l-1.6 1.6"></path>
        </svg>
        <span id="update-dot" class="update-dot" hidden>有可用更新</span>
      </button>
      <span class="sheen" aria-hidden="true"></span>
    </form>
    <section id="board" hidden>
      <div id="board-body"></div>
    </section>
  </div>
  <script src="i18n.js"></script>
  <script src="reading.js"></script>
  <script src="app.js"></script>
</body>
</html>
